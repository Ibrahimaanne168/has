services:
  - type: web
    name: has
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_ADMIN
        value: "221770000000"
